##############################################################
# CALIBO API AUTOMATION FRAMEWORK CONFIGURATION
##############################################################

##############################################################
# Environment
##############################################################

environment=QA

##############################################################
# Application URLs
##############################################################

base.url=https://accelerate-qa.calibo.com
login.url=https://accelerate-qa.calibo.com

##############################################################
# Authentication
##############################################################

username=your.email@calibo.com
password=your_password

##############################################################
# Tenant
##############################################################

tenant.name=Your Tenant Name
tenant.id=

##############################################################
# Browser Configuration
##############################################################

browser=chrome
headless=false

##############################################################
# Selenium Configuration
##############################################################

explicit.wait=60
page.load.timeout=120

##############################################################
# API Configuration
##############################################################

content.type=application/json

##############################################################
# Retry Configuration
##############################################################

retry.count=2
retry.interval=3000

##############################################################
# Framework Configuration
##############################################################

console.logs=true
capture.request=true
capture.response=true

##############################################################
# Test Data
##############################################################

test.data.path=src/test/resources/

users.json=users.json
project.json=project.json

##############################################################
# Optional Proxy (Leave blank if not used)
##############################################################

proxy.host=
proxy.port=

##############################################################
# Execution
##############################################################

parallel=false
thread.count=1